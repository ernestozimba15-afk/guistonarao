<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 140" role="img" aria-labelledby="titulo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="titulo">Maputo Motores</title>
  <rect width="560" height="140" rx="22" fill="#0b1f27"/>

  <!-- Símbolo: motor de carro -->
  <g transform="translate(0,-4)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#f2b705" stroke-width="5">
      <!-- tampa das válvulas -->
      <rect x="56" y="46" width="88" height="16" rx="3"/>
      <!-- bloco -->
      <rect x="50" y="62" width="100" height="40" rx="4"/>
      <!-- cárter -->
      <path d="M62 102 L70 114 H130 L138 102"/>
      <!-- tubo de admissão -->
      <path d="M56 54 H38 V76 H50"/>
      <!-- velas -->
      <path d="M70 46 V34 M90 46 V34 M110 46 V34 M130 46 V34"/>
      <path d="M65 34 H75 M85 34 H95 M105 34 H115 M125 34 H135"/>
      <!-- polia -->
      <circle cx="164" cy="84" r="13"/>
    </g>
    <g stroke="#ffffff" stroke-width="3" opacity="0.85">
      <!-- cilindros -->
      <path d="M80 62 V102 M100 62 V102 M120 62 V102"/>
      <circle cx="164" cy="84" r="4"/>
    </g>
  </g>

  <!-- Nome -->
  <text x="204" y="93" font-family="'Barlow Condensed','Arial Narrow',Impact,sans-serif" font-size="64" font-weight="700" fill="#ffffff" textLength="336" lengthAdjust="spacingAndGlyphs">Maputo <tspan fill="#f2b705">Motores</tspan></text>
</svg>
